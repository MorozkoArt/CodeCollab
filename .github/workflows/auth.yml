name: Auth CI

on:
  push:
    paths:
      - 'services/auth/**'
      - 'pkg/**'
      - '.github/workflows/auth.yml'
  pull_request:
    paths:
      - 'services/auth/**'
      - 'pkg/**'
      - '.github/workflows/auth.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/codecollab

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: services/auth
          args: --config=./.golangci.yml --timeout=5m

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:2.26.4-pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: codecollab
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: services/auth/go.sum

      - name: Apply migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          goose \
            -dir services/auth/db/migrations \
            postgres \
            "postgresql://test_user:test_password@localhost:5432/codecollab?sslmode=disable" \
            up

      - name: Run tests
        working-directory: services/auth
        env:
          TEST_DB_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: codecollab
          POSTGRES_SSLMODE: disable
          JWT_SECRET: ci_test_secret_key
          JWT_EXPIRY: 24h
          SERVER_PORT: 8080
        run: go test -v -race -cover ./internal/...

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test]

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            dockerfile: services/auth/docker/auth/Dockerfile
          - name: auth-migrations
            dockerfile: services/auth/docker/migrations/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta - ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build & push - ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
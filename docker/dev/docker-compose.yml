services:
  postgres:
    build:
      context: ../..
      dockerfile: docker/postgres/Dockerfile
    container_name: codecollab-db-dev
    env_file:
      - ../../.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codecollab-dev
    restart: unless-stopped

  migrations:
    build:
      context: ../..
      dockerfile: docker/migrations/Dockerfile
    container_name: codecollab-migrations-dev
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codecollab-dev
    restart: "no"

  backend:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
    container_name: codecollab-backend-dev
    env_file:
      - ../../.env
    ports:
      - "${SERVER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - codecollab-dev
    restart: unless-stopped

  nginx:
    build:
      context: ../..
      dockerfile: docker/nginx/Dockerfile
    container_name: codecollab-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - codecollab-dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
    name: codecollab-postgres-dev

networks:
  codecollab-dev:
    name: codecollab-dev
    driver: bridge
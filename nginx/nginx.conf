events {
    # Сколько одновременных подключений может обрабатывать nginx
    worker_connections 1024;
}

http {
    # Блок для HTTP (порт 80)
    server {
        listen 80;
        server_name localhost;
        
        return 301 https://$host$request_uri;
    }

    # Блок для HTTPS (порт 443)
    server {
        listen 443 ssl;
        server_name localhost;

        # Путь к SSL сертификатам
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Обрабатываем все запросы
        location / {
            # Перенаправляем на наше Go-приложение
            proxy_pass http://backend:8080;
            
            # Передаем оригинальные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
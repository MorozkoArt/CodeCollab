name: codecollab-nginx-dev

services:
  nginx:
    build:
      context: ../..
      dockerfile: nginx/nginx/Dockerfile
    container_name: codecollab-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../ssl:/etc/nginx/ssl:ro
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - codecollab-network
    restart: unless-stopped

networks:
  codecollab-network:
    external: true
    name: codecollab-network
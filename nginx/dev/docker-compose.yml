name: codecollab-nginx-dev

services:
  nginx:
    build:
      context: ../..
      dockerfile: nginx/nginx/Dockerfile
    container_name: codecollab-nginx-dev
    ports:
      - "${NGINX_HTTP_PORT}:${NGINX_HTTP_PORT}"
      - "${NGINX_HTTPS_PORT}:${NGINX_HTTPS_PORT}"
    volumes:
      - ../ssl:/etc/nginx/ssl:ro
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - codecollab-network

networks:
  codecollab-network:
    external: true
    name: codecollab-network